<nav
  class="bg-white w-full z-20 top-0 start-0 border-b border-slate-200 fixed top-0 left-0 shadow-sm"
>
  <div class="max-w-screen-xl flex flex-wrap items-center justify-between mx-auto p-3">
    <a routerLink="/feed" class="flex items-center space-x-3 rtl:space-x-reverse">
      <img src="/assets/logo.svg" class="h-8 rounded" alt="Route Logo" />
      <span class="self-center text-xl text-slate-900 font-bold whitespace-nowrap">Route Posts</span>
    </a>

    <div class="flex items-center md:order-2 space-x-3 md:space-x-0 rtl:space-x-reverse">
      <button
        type="button"
        class="flex text-sm bg-white rounded-full md:me-0 focus:ring-4 focus:ring-blue-100"
        id="user-menu-button"
        aria-expanded="false"
        data-dropdown-toggle="user-dropdown"
        data-dropdown-placement="bottom"
      >
        <span class="sr-only">Open user menu</span>
        <img
          class="w-9 h-9 cursor-pointer rounded-full object-cover border-2 border-slate-100"
          [src]="currentUser?.photo || defaultAvatar"
          [alt]="currentUser?.name || 'User photo'"
        />
      </button>
      <div
        class="z-50 hidden bg-white border border-slate-200 rounded-xl shadow-lg w-48"
        id="user-dropdown"
      >
        <div class="px-4 py-3 text-sm border-b border-slate-100">
          <span class="block text-slate-900 font-semibold">{{ currentUser?.name || 'User' }}</span>
          <span class="block text-slate-500 text-xs">@{{ currentUser?.username || 'username' }}</span>
        </div>
        <ul class="p-2 text-sm text-slate-700 font-medium" aria-labelledby="user-menu-button">
          <li>
            <a
              routerLink="/profile"
              class="inline-flex items-center gap-2 w-full p-2 hover:bg-slate-50 hover:text-slate-900 rounded-lg"
            >
              <i class="fa-regular fa-user"></i> Profile
            </a>
          </li>
          <li>
            <a
              routerLink="/change"
              routerLinkActive="bg-slate-50"
              class="inline-flex items-center gap-2 w-full p-2 hover:bg-slate-50 hover:text-slate-900 rounded-lg"
            >
              <i class="fa-solid fa-gear"></i> Settings
            </a>
          </li>
          <li>
            <button
              (click)="logOut()"
              class="inline-flex cursor-pointer items-center gap-2 w-full p-2 hover:bg-red-50 hover:text-red-600 rounded-lg text-left"
            >
              <i class="fa-solid fa-right-from-bracket"></i> Log out
            </button>
          </li>
        </ul>
      </div>
      <button
        data-collapse-toggle="navbar-user"
        type="button"
        class="inline-flex items-center p-2 w-10 h-10 justify-center text-sm text-slate-600 rounded-lg md:hidden hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-100"
        aria-controls="navbar-user"
        aria-expanded="false"
      >
        <span class="sr-only">Open main menu</span>
        <svg class="w-6 h-6" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <path stroke="currentColor" stroke-linecap="round" stroke-width="2" d="M5 7h14M5 12h14M5 17h14" />
        </svg>
      </button>
    </div>

    <div class="items-center justify-between hidden w-full md:flex md:w-auto md:order-1" id="navbar-user">
      <ul class="font-medium flex flex-col p-4 md:p-0 mt-4 md:flex-row md:space-x-2 md:mt-0">
        <li>
          <a
            routerLink="/feed"
            routerLinkActive="bg-blue-50 text-blue-700"
            [routerLinkActiveOptions]="{ exact: true }"
            class="flex items-center gap-2 py-2 px-4 text-slate-600 rounded-lg hover:bg-slate-50 transition-colors"
          >
            <i class="fa-regular fa-house"></i> Feed
          </a>
        </li>
        <li>
          <a
            routerLink="/profile"
            routerLinkActive="bg-blue-50 text-blue-700"
            class="flex items-center gap-2 py-2 px-4 text-slate-600 rounded-lg hover:bg-slate-50 transition-colors"
          >
            <i class="fa-regular fa-user"></i> Profile
          </a>
        </li>
        <li>
          <a
            routerLink="/notifications"
            routerLinkActive="bg-blue-50 text-blue-700"
            class="flex items-center gap-2 py-2 px-4 text-slate-600 rounded-lg hover:bg-slate-50 transition-colors"
          >
            <div class="relative">
              <i class="fa-regular fa-bell"></i>
              @if (unreadCount > 0) {
                <span class="absolute -top-1.5 -right-1.5 bg-red-500 text-white text-[10px] font-bold w-4 h-4 flex items-center justify-center rounded-full border border-white">{{ unreadCount > 9 ? '9+' : unreadCount }}</span>
              }
            </div>
            Notifications
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>
