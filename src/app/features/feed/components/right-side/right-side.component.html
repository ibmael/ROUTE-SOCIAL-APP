<aside class="bg-white sticky top-[80px] rounded-2xl shadow-sm border border-slate-200 p-4 font-sans">
  <div class="flex items-center justify-between mb-4 px-1">
    <div class="flex items-center gap-2">
      <i class="fa-solid fa-user-group text-blue-600"></i>
      <h2 class="font-bold text-slate-900 text-[16px]">Suggested Friends</h2>
    </div>
    <span class="bg-blue-50 text-blue-600 text-xs font-bold px-2.5 py-1 rounded-full">{{
      suggestions.length
    }}</span>
  </div>

  <div class="relative mb-4">
    <div class="absolute inset-y-0 start-0 flex items-center ps-3.5 pointer-events-none">
      <i class="fa-solid fa-magnifying-glass text-slate-400 text-sm"></i>
    </div>
    <input
      type="text"
      [(ngModel)]="searchTerm"
      class="bg-slate-50 border border-slate-200 text-slate-800 text-sm rounded-xl focus:ring-2 focus:ring-blue-100 focus:border-blue-300 block w-full ps-10 p-2.5 placeholder-slate-400 outline-none"
      placeholder="Search friends..."
      aria-label="Search friends"
    />
  </div>

  <div class="grid gap-3 overflow-y-auto max-h-80 [&::-webkit-scrollbar]:w-1.5 [&::-webkit-scrollbar-track]:bg-transparent [&::-webkit-scrollbar-thumb]:bg-slate-200 [&::-webkit-scrollbar-thumb]:rounded-full hover:[&::-webkit-scrollbar-thumb]:bg-slate-300 pr-1">
    @for (user of filteredSuggestions; track user._id) {
      <div class="p-3 border border-slate-100 rounded-xl bg-slate-50/50 hover:border-slate-200 transition-colors">
        <div class="flex items-center gap-3">
          <a [routerLink]="['/profile', user._id]">
            <img
              [src]="user.photo || '/assets/user-icon.svg'"
              [alt]="user.name"
              class="w-10 h-10 rounded-full object-cover shrink-0"
            />
          </a>
          <div class="flex-1 min-w-0">
            <a [routerLink]="['/profile', user._id]" class="text-sm font-bold text-slate-900 truncate block hover:underline">
              {{ user.name }}
            </a>
            <p class="text-xs text-slate-500 truncate">@{{ user.username }}</p>
          </div>
          <button
            (click)="followUser(user)"
            [disabled]="isFollowing(user)"
            class="shrink-0 px-3 py-1.5 text-xs font-semibold rounded-lg transition-colors cursor-pointer disabled:cursor-default"
            [class.bg-slate-100]="isFollowing(user)"
            [class.text-slate-600]="isFollowing(user)"
            [class.bg-blue-600]="!isFollowing(user)"
            [class.text-white]="!isFollowing(user)"
            [class.hover:bg-blue-700]="!isFollowing(user)"
          >
            {{ isFollowing(user) ? 'Following' : 'Follow' }}
          </button>
        </div>
      </div>
    } @empty {
      <p class="text-sm text-slate-500 text-center py-4">No suggestions found</p>
    }
  </div>
</aside>
