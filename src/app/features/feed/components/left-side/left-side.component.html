<aside
  class="w-full text-sm sticky top-[80px] bg-white rounded-[20px] shadow-sm border border-slate-200 p-2.5 flex flex-col gap-1"
  aria-label="Sidebar Navigation"
>
  <a
    routerLink="/feed"
    routerLinkActive="bg-blue-50 text-blue-600"
    [routerLinkActiveOptions]="{ exact: true }"
    class="flex items-center gap-4 p-2.5 rounded-xl text-slate-700 font-semibold hover:bg-slate-50 transition-colors"
  >
    <i class="fa-regular fa-newspaper w-5 text-center"></i>
    <span>Feed</span>
  </a>

  <a
    routerLink="/profile"
    routerLinkActive="bg-blue-50 text-blue-600"
    class="flex items-center gap-4 p-2.5 rounded-xl text-slate-700 font-semibold hover:bg-slate-50 transition-colors"
  >
    <i class="fa-regular fa-user w-5 text-center"></i>
    <span>Profile</span>
  </a>

  <a
    routerLink="/notifications"
    routerLinkActive="bg-blue-50 text-blue-600"
    class="flex items-center gap-4 p-2.5 rounded-xl text-slate-700 font-semibold hover:bg-slate-50 transition-colors"
  >
    <i class="fa-regular fa-bell w-5 text-center"></i>
    <span>Notifications</span>
  </a>

  <a
    routerLink="/bookmarks"
    routerLinkActive="bg-blue-50 text-blue-600"
    class="flex items-center gap-4 p-2.5 rounded-xl text-slate-700 font-semibold hover:bg-slate-50 transition-colors"
  >
    <i class="fa-regular fa-bookmark w-5 text-center"></i>
    <span>Saved</span>
  </a>

  <a
    routerLink="/change"
    routerLinkActive="bg-blue-50 text-blue-600"
    class="flex items-center gap-4 p-2.5 rounded-xl text-slate-700 font-semibold hover:bg-slate-50 transition-colors"
  >
    <i class="fa-solid fa-gear w-5 text-center"></i>
    <span>Settings</span>
  </a>

  <hr class="my-2 border-slate-100" />

  <h3 class="px-3 text-xs font-bold text-slate-400 uppercase tracking-wider mb-1 mt-2">Community</h3>
  
  <a
    href="#"
    class="flex items-center gap-4 p-2.5 rounded-xl text-slate-700 font-semibold hover:bg-slate-50 transition-colors"
  >
    <i class="fa-solid fa-users w-5 text-center text-blue-500"></i>
    <span>Groups</span>
  </a>

  <a
    href="#"
    class="flex items-center gap-4 p-2.5 rounded-xl text-slate-700 font-semibold hover:bg-slate-50 transition-colors"
  >
    <i class="fa-solid fa-calendar-check w-5 text-center text-green-500"></i>
    <span>Events</span>
  </a>
</aside>
