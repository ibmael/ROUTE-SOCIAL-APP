<div class="min-h-screen bg-gray-900 flex items-center justify-center p-14">
  <div
    class="grid md:grid-cols-2 w-full max-w-5xl bg-gray-800 rounded-2xl shadow-xl overflow-hidden"
  >
    <!-- Left Side (Branding) -->
    <div
      class="hidden md:flex flex-col justify-center items-center bg-gradient-to-br from-blue-600 to-purple-600 text-white p-10"
    >
      <h1 class="text-4xl font-bold mb-4">Connectify</h1>
      <p class="text-center text-lg opacity-90">
        Join thousands of people sharing moments, stories, and ideas.
      </p>

      <img
        src="https://flowbite.s3.amazonaws.com/blocks/marketing-ui/authentication/illustration.svg"
        class="mt-10 w-72"
      />
    </div>

    <!-- Right Side (Form) -->
    <div class="p-10">
      <h2 class="text-3xl font-bold text-white mb-2">Create Account</h2>
      <p class="text-gray-400 mb-6">Start your social journey today 🚀</p>

      <form class="space-y-5" [formGroup]="registerForm" (ngSubmit)="submitForm()">
        <!-- Name -->
        <div>
          <label class="block mb-2 text-sm font-medium text-gray-300"> Full Name </label>
          <input
            type="text"
            formControlName="name"
            placeholder="please enter your full name"
            class="w-full rounded-lg bg-gray-700 border border-gray-600 text-white p-3 focus:ring-2 focus:ring-blue-500 focus:outline-none"
          />
        </div>
        <!-- Username -->
        <div>
          <label class="block mb-2 text-sm font-medium text-gray-300"> Username </label>
          <input
            type="text"
            formControlName="username"
            placeholder="@username"
            class="w-full rounded-lg bg-gray-700 border border-gray-600 text-white p-3 focus:ring-2 focus:ring-blue-500 focus:outline-none"
          />
        </div>
        <!-- Email -->
        <div>
          <label class="block mb-2 text-sm font-medium text-gray-300"> Email </label>
          <input
            type="email"
            formControlName="email"
            placeholder="name@email.com"
            class="w-full rounded-lg bg-gray-700 border border-gray-600 text-white p-3 focus:ring-2 focus:ring-blue-500 focus:outline-none"
          />
        </div>

        <!-- Gender -->
        <div>
          <label class="block mb-2 text-sm font-medium text-gray-300" for="gender"> Gender </label>

          <select
            id="gender"
            formControlName="gender"
            class="w-full rounded-lg bg-gray-700 border border-gray-600 text-white p-3 focus:ring-2 focus:ring-blue-500"
          >
            <option value="">Select Gender</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
          </select>
        </div>

        <!-- Date of Birth -->
        <div>
          <label class="block mb-2 text-sm font-medium text-gray-300"> Date of Birth </label>

          <input
            formControlName="dateOfBirth"
            type="date"
            class="w-full rounded-lg bg-gray-700 border border-gray-600 text-white p-3 focus:ring-2 focus:ring-blue-500 focus:outline-none"
          />
        </div>
        <!-- Password -->
        <div>
          <label class="block mb-2 text-sm font-medium text-gray-300"> Password </label>
          <input
            type="password"
            formControlName="password"
            placeholder="••••••••"
            class="w-full rounded-lg bg-gray-700 border border-gray-600 text-white p-3 focus:ring-2 focus:ring-blue-500 focus:outline-none"
          />
        </div>

        <!-- Confirm Password -->
        <div>
          <label class="block mb-2 text-sm font-medium text-gray-300"> Confirm Password </label>
          <input
            type="password"
            formControlName="rePassword"
            placeholder="••••••••"
            class="w-full rounded-lg bg-gray-700 border border-gray-600 text-white p-3 focus:ring-2 focus:ring-blue-500 focus:outline-none"
          />
        </div>

        <!-- Submit -->
        <button
          type="submit"
          class="w-full cursor-pointer disabled:bg-gray-600 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition"
        >
          Create Account
        </button>
      </form>

      <!-- Divider -->
      <div class="flex items-center my-6">
        <div class="flex-grow border-t border-gray-600"></div>
        <span class="mx-4 text-gray-400 text-sm">or continue with</span>
        <div class="flex-grow border-t border-gray-600"></div>
      </div>

      <!-- Social login -->
      <div class="grid grid-cols-2 gap-4">
        <button
          class="flex cursor-pointer items-center justify-center gap-2 border border-gray-600 rounded-lg py-2 text-white hover:bg-gray-700 transition"
        >
          <i class="fa-brands fa-google"></i>
          Google
        </button>

        <button
          class="flex cursor-pointer items-center justify-center gap-2 border border-gray-600 rounded-lg py-2 text-white hover:bg-gray-700 transition"
        >
          <i class="fa-brands fa-github"></i>
          GitHub
        </button>
      </div>

      <p class="text-sm text-gray-400 mt-6 text-center">
        Already have an account?
        <a class="text-blue-500 hover:underline cursor-pointer">Login</a>
      </p>
    </div>
  </div>
</div>
