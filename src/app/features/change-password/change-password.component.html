<div class="max-w-md mx-auto px-4 py-8">
  <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm">
    <h1 class="text-2xl font-bold text-slate-900 mb-1">Change Password</h1>
    <p class="text-sm text-slate-500 mb-6">Update your account password</p>

    <form [formGroup]="changeForm" (ngSubmit)="submit()" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Current password</label>
        <input
          type="password"
          formControlName="password"
          class="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm focus:ring-2 focus:ring-blue-100 focus:border-blue-400 outline-none"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">New password</label>
        <input
          type="password"
          formControlName="newPassword"
          class="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm focus:ring-2 focus:ring-blue-100 focus:border-blue-400 outline-none"
        />
        @if (changeForm.get('newPassword')?.invalid && changeForm.get('newPassword')?.touched) {
          <p class="text-red-500 text-xs mt-1">Must be 6+ chars with letters and numbers</p>
        }
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Confirm new password</label>
        <input
          type="password"
          formControlName="confirmPassword"
          class="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm focus:ring-2 focus:ring-blue-100 focus:border-blue-400 outline-none"
        />
      </div>

      @if (errorMessage) {
        <p class="text-red-600 text-sm bg-red-50 p-3 rounded-lg">{{ errorMessage }}</p>
      }

      <div class="flex gap-3 pt-2">
        <button
          type="submit"
          [disabled]="isLoading"
          class="flex-1 bg-blue-600 hover:bg-blue-700 disabled:bg-slate-400 text-white font-semibold py-2.5 rounded-lg transition-colors cursor-pointer"
        >
          @if (isLoading) {
            <i class="fa-solid fa-spinner animate-spin"></i>
          } @else {
            Update password
          }
        </button>
        <a
          routerLink="/feed"
          class="px-4 py-2.5 border border-slate-300 rounded-lg text-slate-600 hover:bg-slate-50 text-sm font-medium flex items-center"
        >
          Cancel
        </a>
      </div>
    </form>
  </div>
</div>
